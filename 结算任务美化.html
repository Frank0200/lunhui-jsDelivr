          function injectProgrammaticIncomeStage(d, result) {
            let stage = d.stages.find(function(s) { return s.type === 'income'; });
            if (!stage) {
              stage = { name:'空间币收益核算', type:'income', items:[] };
              const epilogueIndex = d.stages.findIndex(function(s) { return s.type === 'epilogue'; });
              if (epilogueIndex >= 0) d.stages.splice(epilogueIndex, 0, stage);
              else d.stages.push(stage);
            }
            // SETTLEMENT_LEGACY_INCOME_CLEANUP
            const legacyIncomeSubs = new Set(['击杀目标附加收益明细','世界探索附加收益明细','势力羁绊附加收益明细']);
            const aiNonCoinItems = (stage.items || []).filter(function(item) {
              if (item.kind === 'calc' || item.kind === 'sum' || item.kind === 'total') return false;
              const legacySub = String(item && item.sub || '').trim();
              const legacyName = String(item && item.name || '').trim();
              if (legacyIncomeSubs.has(legacySub) || legacyIncomeSubs.has(legacyName)) return false;
              try { if (/空间币/.test(JSON.stringify(item))) return false; } catch (e) {}
              return true;
            });
            stage.items = buildProgrammaticIncomeItems(result).concat(aiNonCoinItems);
          }

          function gradeBadge(v, reincarnator) {
            const t = gradeTier(v);
            return '<span class="st-grade g-' + t + (reincarnator ? ' reincarnator' : '') + '">' + escapeHtml(t) + '</span>';
          }

          function rateRow(k, v) {
            const gm = String(v).trim().match(/^([A-Za-z]{1,3})\s*[-~—–]\s*([A-Za-z]{1,3})$/);
            if (gm && GRADES.indexOf(gm[1].toUpperCase()) >= 0 && GRADES.indexOf(gm[2].toUpperCase()) >= 0) {
              return '<div class="st-rate-row"><span class="k">' + escapeHtml(k) + '</span>' +
                  '<span class="st-grade g-' + gradeTier(gm[1]) + '">' + escapeHtml(gm[1].toUpperCase()) + '</span>' +
                  '<span class="st-grade wave">~</span>' +
                  '<span class="st-grade g-' + gradeTier(gm[2]) + '">' + escapeHtml(gm[2].toUpperCase()) + '</span></div>';
            }
            return '<div class="st-rate-row"><span class="k">' + escapeHtml(k) + '</span>' + gradeBadge(v, /表现/.test(k)) + '</div>';
          }

          function renderItem(it, st) {
            switch (it.kind) {
              case 'sub': return '<div class="st-sub">' + escapeHtml(it.name) + '</div>';
              case 'kv': {
                const k = it.k, v = it.v;
                if (/评级|等级|难度|基准/.test(k) && /^[A-Za-z]{1,3}$/.test(v.trim()) && GRADES.indexOf(v.trim().toUpperCase()) >= 0) return rateRow(k, v);
                if (/难度|评级/.test(k) && /^[A-Za-z]{1,3}\s*[-~—–]\s*[A-Za-z]{1,3}$/.test(v.trim())) return rateRow(k, v);
                if ((k === '获得物品' || k === '获得') && /^【.+】$/.test(v)) return '<div class="st-relic-name">' + escapeHtml(v) + '</div>';
                if (k === '判定结果') { const okV = /满足|授予/.test(v) && !/未获得/.test(v); return '<div class="st-verdict ' + (okV ? 'ok' : 'no') + '">' + (okV ? '✔ ' : '✕ ') + escapeHtml(v) + '</div>'; }
                if (k === '描述' && /[“”"]/.test(v)) return '<div class="st-relic-quote">' + escapeHtml(v) + '</div>';
                if (k === '效果' && /事迹留存/.test(v)) return '<div class="st-kv effect"><span class="k">' + escapeHtml(k) + '</span><span class="v">' + escapeHtml(v) + '</span></div>';
                if (/评述/.test(k)) return '<div class="st-comment">' + escapeHtml(v) + '</div>';
                if (st && st.type === 'income' && /奖励|收益/.test(k)) return '<div class="st-kv income-v"><span class="k">' + escapeHtml(k) + '</span><span class="v">' + escapeHtml(v) + '</span></div>';
                return '<div class="st-kv"><span class="k">' + escapeHtml(k) + '</span><span class="v">' + escapeHtml(v) + '</span></div>';
              }
              case 'reasonHead': return '<div class="st-reason-head">' + escapeHtml(it.text) + '</div>';
              case 'reason': return '<div class="st-reason">' + escapeHtml(it.text) + '</div>';
              case 'stab': { const width = Math.max(0, Math.min(100, Number(it.to) || 0)); return '<div class="st-stab"><div class="st-stab-label"><span>世界稳定值变动</span><span><b>100%</b> → <b>' + it.to + '%</b></span></div><div class="st-stab-bar"><div class="st-stab-fill" data-w="' + width + '" style="width:' + width + '%"></div></div></div>'; }
              case 'brand': return '<div class="st-brand"><div class="st-brand-label">副 本 烙 印</div><div class="st-brand-name">' + escapeHtml(it.name) + '</div></div>';
              case 'hl': return '<div class="st-tl-item"><span class="t">' + escapeHtml(it.t) + '</span>' + (it.d ? '<span class="d">：' + escapeHtml(it.d) + '</span>' : '') + '</div>';
              case 'calc': {
                const tier = (String(it.src).match(/[ⅠⅡⅢⅣⅤⅥⅦⅧⅨ]/) || [''])[0];
                const srcTxt = tier ? (tier + '级目标') : (it.src || '收益项');
                return '<div class="st-calc-row"><span class="st-calc-src">[' + escapeHtml(srcTxt) + ']</span><span class="st-calc-formula">' + escapeHtml(it.formula) + '</span><span class="st-calc-sum">= ' + escapeHtml(it.result) + '</span></div>';
              }
              case 'punish': return '<div class="st-punish"><span class="t">⚠ ' + escapeHtml(it.name) + '</span><span class="d">' + escapeHtml(it.desc) + '</span></div>';
              case 'sum': return '<div class="st-sum-row' + (/计入/.test(it.name) ? ' final' : '') + '"><span class="k">' + escapeHtml(it.name) + '</span><span class="v">' + escapeHtml(it.v) + '</span></div>';
              case 'total': {
                const neg = it.num != null && it.num < 0;
                const numText = it.num != null ? fmtNum(it.num) : it.text;
                return '<div class="st-total' + (neg ? ' neg' : '') + '"><div class="st-total-label">个 人 最 终 总 收 益</div><div class="st-total-num"><span class="st-num-val">' + escapeHtml(numText) + '</span><span class="unit">空间币</span></div>' + (it.debt ? '<div class="st-total-debt">⚠ 余额不足 · 账户进入负债状态 · 脱离主神空间前需强制偿还</div>' : '') + '<div class="st-total-done">已 清 算 完 毕</div></div>';
              }
              case 'note': return '<div class="st-note">※ ' + escapeHtml(it.text) + '</div>';
              case 'notice': return '<div class="st-notice">◈ ' + escapeHtml(it.text) + '</div>';
              case 'empty': return '<div class="st-empty">' + escapeHtml(it.text) + '</div>';
              case 'warehouse': return '<div class="st-warehouse">📦 仓库检测：' + escapeHtml(it.text) + '</div>';
              case 'lootItem': {
                const tm = String(it.note || '').match(/[【\[]([^】\]]+)[】\]]/);
                const badge = tm ? tm[1] : it.note;
                return '<div class="st-loot-item"><span class="n">' + escapeHtml(it.name) + '</span><span class="d"> (产地: ' + escapeHtml(it.origin) + ')</span>' + (badge ? '<span class="compress">⚡ ' + escapeHtml(badge) + '</span>' : '') + '</div>';
              }
              case 'closing': return '<div class="st-closing">' + escapeHtml(it.text) + '</div>';
              case 'para': {
                const t = it.text;
                const sub = it.sub || '';
                if (/^【.+】$/.test(t)) return '<div class="st-relic-name">' + escapeHtml(t) + '</div>';
                if (/凭证/.test(sub)) return '<div class="st-cert-desc">' + escapeHtml(t) + '</div>';
                if (/遗物/.test(sub)) return '<div class="st-note">' + escapeHtml(t) + '</div>';
                if (/传闻/.test(sub)) return '<div class="st-tl-item rumor"><span class="d">' + escapeHtml(t) + '</span></div>';
                return '<div class="st-para">' + escapeHtml(t) + '</div>';
              }
              default: return '';
            }
          }

          function renderSettlement(d) {
            let html = '';
            let achievementInserted = false;
            let credentialInserted = false;
            const hasLegacyCredentialPanel = d.stages.some(function(stage) {
              return stage.items.some(function(item) { return item.kind === 'cert'; });
            });
            html += '<div class="st-banner"><div class="st-banner-main">' + escapeHtml(d.title || '主神空间 · 轮回清算协议') + '</div><div class="st-banner-tags">';
            if (d.serial) html += '<span class="st-tag">协议序列 <b>' + escapeHtml(d.serial) + '</b></span>';
            if (d.player) html += '<span class="st-tag">轮回者 <b>' + escapeHtml(d.player) + '</b></span>';
            html += '</div></div>';

            d.stages.forEach(function(st, idx) {
              if (!st.items.length) return;
              let inner = '';
              const items = st.items;
              let i = 0;
              let rewardSeen = false;
              let trialInserted = false;

              while (i < items.length) {
                const it = items[i];

                if (it.kind === 'sub' && /任务专属奖励/.test(it.name || '')) rewardSeen = true;
                if (rewardSeen && !trialInserted && it.kind === 'sub' && !/任务专属奖励/.test(it.name || '') && (trialTasks.length || /晋升试炼[·\.]/.test(rawText))) {
                  inner += '<div class="st-trial-host">' + renderTrialPanel() + '</div>';
                  trialInserted = true;
                }

                if (it.kind === 'kv' && /任务专属奖励/.test(it.sub || '')) {
                  let rows = '';
                  while (i < items.length && items[i].kind === 'kv' && /任务专属奖励/.test(items[i].sub || '')) {
                    const reward = items[i];
                    const valueClass = /已发放|获得|到账/.test(reward.v || '') ? ' reward-ok' : '';
                    rows += '<div class="st-sum-row"><span class="k">' + escapeHtml(reward.k) + '</span><span class="v' + valueClass + '">' + escapeHtml(reward.v) + '</span></div>';
                    i++;
                  }
                  inner += '<div class="st-sum-rows st-task-reward-box">' + rows + '</div>';
                  continue;
                }

                if (it.kind === 'sum') {
                  let rows = '';
                  while (i < items.length && items[i].kind === 'sum') { rows += renderItem(items[i], st); i++; }
                  inner += '<div class="st-sum-rows">' + rows + '</div>';
                  continue;
                }

                if (it.kind === 'cert' || it.kind === 'relic' || it.kind === 'relicGold') {
                  const cardSub = it.sub;
                  i++;
                  let card = '';
                  while (i < items.length && (items[i].kind === 'kv' || items[i].kind === 'para' || items[i].kind === 'reasonHead' || items[i].kind === 'reason') && items[i].sub === cardSub) {
                    card += renderItem(items[i], st);
                    i++;
                  }
                  if (!card) card = '<div class="st-cert-desc">系统核录完毕。</div>';
                  if (it.kind === 'cert') inner += '<div class="st-cert"><div class="st-cert-title">◆ 主神权限凭证</div>' + card + '</div>';
                  else if (it.kind === 'relic') inner += '<div class="st-relic"><div class="st-relic-label">' + escapeHtml(it.label || '世界结晶') + '</div>' + card + '</div>';
                  else inner += '<div class="st-relic gold"><div class="st-relic-label">' + escapeHtml(it.label || '世界遗物') + '</div>' + card + '</div>';
                  continue;
                }

                inner += renderItem(it, st);
                i++;
              }

              if (rewardSeen && !trialInserted && (trialTasks.length || /晋升试炼[·\.]/.test(rawText))) {
                inner += '<div class="st-trial-host">' + renderTrialPanel() + '</div>';
              }

              if (!achievementInserted && st.type === 'income' && achievementTasks.length) {
                inner += '<div class="st-achievement-host">' + renderAchievementPanel() + '</div>';
                achievementInserted = true;
              }

              if (!credentialInserted && !hasLegacyCredentialPanel && st.type === 'income') {
                inner += '<div class="st-cert-host">' + renderCredentialPanel(credentialDecision) + '</div>';
                credentialInserted = true;
              }

              html += '<div class="st-stage t-' + st.type + '"><div class="st-stage-head"><span class="st-stage-no">' + (idx + 1) + '</span><span class="st-stage-name">' + escapeHtml(st.name || '结算阶段') + '</span><span class="st-stage-line"></span></div>' + inner + '</div>';
            });
            return html;
          }

          function renderPlain(text) {
            return String(text).replace(/\r/g, '').split('\n')
                .filter(function(l) { return l.trim(); })
                .map(function(l) { return '<div class="st-plain-line">' + escapeHtml(l.trim()) + '</div>'; })
                .join('');
          }

          function hasSettlementHeader(text) {
            return String(text || '').includes('轮回清算协议');
          }

          function isFullSettlement(text) {
            const source = String(text || '');
            return ['轮回清算协议', '世界因果与综合评估', '因果烙印与干涉回放', '因果演进与世界暗流']
              .every(function(kw) { return source.includes(kw); });
          }

          function isLatestPanelMessage(win, targetMessageId) {
            if (targetMessageId === null || targetMessageId === undefined) return false;
            try {
              const latestId = latestChatMessageId(latestChatMessage(win));
              return latestId != null && Number(latestId) === Number(targetMessageId);
            } catch (e) {}
            return false;
          }

          function settlementTextFingerprint(value) {
            const source = normalizeSettlementComparableText(value);
            let hash = 2166136261;
            for (let i = 0; i < source.length; i++) {
              hash ^= source.charCodeAt(i);
              hash = Math.imul(hash, 16777619);
            }
            return (hash >>> 0).toString(36);
          }

          function resolveSettlementMessageTarget(win, panelText) {
            const panelMessageId = getPanelMessageId(win);
            if (panelMessageId !== null) {
              return {
                targetMessageId: panelMessageId,
                marker: String(panelMessageId),
                isLatestPanel: isLatestPanelMessage(win, panelMessageId)
              };
            }

            // 极少数环境连 latest 的数字ID都不给：仅当 latest 原文完整包含当前面板结算文本时允许写 latest。
            const latest = latestChatMessage(win);
            if (!panelTextBelongsToMessage(panelText, latest)) return null;
            const latestId = latestChatMessageId(latest);
            return {
              targetMessageId: 'latest',
              marker: latestId !== null ? String(latestId) : ('text:' + settlementTextFingerprint(panelText)),
              isLatestPanel: true
            };
          }

          function applySettlementFinalization(c, isLatestPanel) {
            // 历史结算面板只负责展示，绝不清理当前数据库。
            if (!isLatestPanel) return false;
            const stat = c && (c.stat_data || c);
            if (!stat) return false;

            const hasHeader = hasSettlementHeader(rawText);
            const fullSettlement = isFullSettlement(rawText);
            const trialPassed = isTrialPassed(trialTasks);
            const currentReincarnatorTier = readReincarnatorTier(stat);
            const reincarnatorTierChanged = currentReincarnatorTier !== settlementBaselineTier;
            let changed = false;

            function sameValue(a, b) {
              if (a === b) return true;
              try { return JSON.stringify(a) === JSON.stringify(b); }
              catch (e) { return false; }
            }

            function setValue(target, key, value) {
              if (sameValue(target[key], value)) return;
              target[key] = value;
              changed = true;
            }

            function ensureObject(target, key) {
              const cur = target[key];
              if (!cur || typeof cur !== 'object' || Array.isArray(cur)) {
                target[key] = {};
                changed = true;
              }
              return target[key];
            }

            // 对齐原 onShouldIAdvance：仅出现清算协议标题时，也可补写晋升完成标记；
            // 完整清算则沿用原 onClearCache 语义，只要数据库中的晋升试炼全部处于认可完成态就记为完成。
            // 层级已经变化表示本次资格已用于普升；旧结算面板不得再次补写。
            if (hasHeader && trialPassed && !reincarnatorTierChanged) {
              const currentSys = stat.系统状态 && typeof stat.系统状态 === 'object' ? stat.系统状态 : {};
              if (currentSys.试炼已完成 !== true) {
                const sys = ensureObject(stat, '系统状态');
                setValue(sys, '试炼已完成', true);
              }
            }

            if (!fullSettlement) return changed;
            // 等待任务变量落到认可完成态/失败，避免先清空后再也无法核验晋升资格。
            if (trialTasks.some(function(task){return !isSettlementTaskTerminal(task.status);})) return changed;

            // 成功/失败都表示本轮试炼生命周期结束；身份标记只消费一次，历史面板不能复活它。
            const activeTrialSys = stat.系统状态 && typeof stat.系统状态 === 'object' ? stat.系统状态 : null;
            if (activeTrialSys && activeTrialSys.是否试炼任务 === true) {
              const sys = ensureObject(stat, '系统状态');
              setValue(sys, '是否试炼任务', false);
              setValue(sys, '试炼任务名单', []);
            }

            const isSingleWorld = !!(stat.设置 && stat.设置.单一世界 === true);
            const tasks = ensureObject(stat, '任务');
            const world = ensureObject(stat, '世界');
            setValue(tasks, '击杀', {Ⅰ:0, Ⅱ:0, Ⅲ:0, Ⅳ:0, Ⅴ:0, Ⅵ:0, Ⅶ:0, Ⅷ:0, Ⅸ:0});

            if (!isSingleWorld) {
              setValue(world, '探索', {});
              // 与副本缓存同生命周期，避免后台事件跨副本继承。
              setValue(world, '后台', {});

              // 普通副本离开当前世界时，关系人物也必须遵循世界生命周期。
              // 只有明确建立组队关系的正式队友可跨世界保留；高好感、仍在场或普通关系都不是保留条件。
              const relations = ensureObject(stat, '关系列表');
              Object.keys(relations).forEach(function(name) {
                const npc = relations[name];
                if (!npc || npc.是否队友 !== true) delete relations[name];
              });

              setValue(world, '势力', {});
              setValue(world, '稳定', 100);
              const radar = ensureObject(world, '异端雷达');
              setValue(radar, '当前模式', '');
              setValue(radar, '名单', {});
              setValue(world, '法则', []);
              setValue(world, '货币', {});
              setValue(world, '因果轨道', {});
              setValue(tasks, '列表', {});
              setValue(tasks, '副本成就', {});

              // 普通副本结束时只保留玩家拥有/共管的资产；纯NPC、势力或无主资产随副本清理。
              // <user> 是提示词宏；程序侧以 Tavern 当前 Persona 名为正式玩家身份，旧标记只做兼容。
              const assets = ensureObject(stat, '资产');
              const playerOwnerName = (() => {
                try {
                  const host = (window.parent && window.parent !== window) ? window.parent : window;
                  const tavern = host?.SillyTavern;
                  return String(tavern?.getContext?.()?.name1 || tavern?.name1 || '').trim();
                } catch (e) { return ''; }
              })();
              const isPlayerAssetOwner = owner => {
                const value = String(owner || '').trim();
                if (!value) return false;
                return (!!playerOwnerName && value === playerOwnerName)
                  || value === '<user>'
                  || value === '{{user}}'
                  || value === '玩家';
              };
              Object.keys(assets).forEach(function(assetName) {
                const asset = assets[assetName];
                const rawOwners = asset && typeof asset === 'object' ? asset.所属对象 : null;
                // 旧存档缺失所属对象时沿用既有迁移语义：视为玩家资产，避免误删。
                if (rawOwners == null) return;
                const owners = Array.isArray(rawOwners) ? rawOwners : [rawOwners];
                if (owners.some(isPlayerAssetOwner)) return;
                delete assets[assetName];
                changed = true;
              });

              const rumors = ensureObject(stat, '传闻');
              setValue(rumors, '街头巷议', {});
              setValue(rumors, '情报交易', {});
              setValue(rumors, '布告与檄文', {});

              const sys = ensureObject(stat, '系统状态');
              // 主神空间使用独立轮回历：第1个游玩日从轮回历1年-04月-04日开始，
              // 之后只按系统状态.游玩天数映射，不继承任何副本世界的年代。
              const playDays = Math.max(1, Math.floor(Number(sys.游玩天数) || 1));
              const samsaraDayIndex = ((4 - 1) * 30 + (4 - 1)) + (playDays - 1);
              const samsaraYear = Math.floor(samsaraDayIndex / 360) + 1;
              const samsaraDayOfYear = samsaraDayIndex % 360;
              const samsaraMonth = Math.floor(samsaraDayOfYear / 30) + 1;
              const samsaraDay = (samsaraDayOfYear % 30) + 1;
              const settlementPad2 = function(value) { return String(value).padStart(2, '0'); };
              const samsaraTime = '轮回历' + samsaraYear + '年-' + settlementPad2(samsaraMonth) + '月-' + settlementPad2(samsaraDay) + '日-清晨';

              setValue(world, '名称', '主神空间');
              setValue(world, '位格', 'Ⅸ');
              setValue(world, '难度', 'F~SSS');
              setValue(world, '时间', samsaraTime);
              // 历法属于副本世界生命周期；主神空间不保留上一副本历法。
              setValue(world, '历法', {});
              // 与轮回历展示值同步锚点，避免辅助计算把“回主神空间”误算成额外跨日。
              setValue(sys, '上次世界日期', samsaraYear + '-' + samsaraMonth + '-' + samsaraDay);
              setValue(sys, '是否在主神空间', true);
            } else {
              // 单一世界继续使用同一世界：探索档案长期保留，但不参与空间币结算。
              // 单一世界没有副本成就；结算时同步清理旧副本/旧版本残留，但不影响当前世界与未结算任务。
              setValue(tasks, '副本成就', {});
              const taskList = ensureObject(tasks, '列表');
              settlementTaskKeys.forEach(function(taskKey) {
                if (!Object.hasOwn(taskList, taskKey)) return;
                delete taskList[taskKey];
                changed = true;
              });
            }

            return changed;
          }

          async function writeSettlementToMvu(d, worldName) {
            if (settlementWriteBusy) { settlementWritePending = true; return; }
            settlementWriteBusy = true;
            try {
              const win = window.parent || window;
              if (!win.Mvu || !win._ || !win._.set) return;
              const settlementTarget = resolveSettlementMessageTarget(win, rawText);
              if (!settlementTarget) return;
              const targetMessageId = settlementTarget.targetMessageId;
              const isLatestPanel = settlementTarget.isLatestPanel;
              const c = win.Mvu.getMvuData({ type: 'message', message_id: targetMessageId });
              if (!c) return;
              const settlementStat = c.stat_data || c;
              const isSingleWorldSettlement = !!(settlementStat.设置 && settlementStat.设置.单一世界 === true);

              // 未完成的晋升试炼只阻止晋升资格与最终清理；已完成主神任务的空间币/凭证/战利品仍正常结算。
              let changed = false;
              let settlementCoinMarkerPending = null;
              if (!settlementCoinWriteDone && isLatestPanel && isFullSettlement(rawText) && settlementStat.角色) {
                const settlementMarker = String(settlementTarget.marker || targetMessageId);
                const recordedMarker = readSettlementCoinMessageMarker(win, targetMessageId);
                const markerState = settlementCoinMarkerState(recordedMarker, settlementMarker);
                const currentCoin = Number(settlementStat.角色.空间币);
                let nextCoin = null;
                settlementCoinWriteDone = true;

                if (markerState === 'legacy') {
                  // 旧版可能已写“一次性标记”却因历史任务快照余额过旧而漏发空间币。
                  nextCoin = settlementCoinLegacyRepairTarget(currentCoin, legacyRawSpaceCoinSettlement, spaceCoinSettlement);
                  settlementCoinMarkerPending = settlementCoinReceiptMarker(settlementMarker, spaceCoinSettlement);
                } else if (markerState !== 'applied') {
                  nextCoin = settlementCoinWriteTarget(currentCoin, spaceCoinSettlement);
                  settlementCoinMarkerPending = settlementCoinReceiptMarker(settlementMarker, spaceCoinSettlement);
                }

                if (nextCoin !== null) {
                  settlementStat.角色.空间币 = nextCoin;
                  changed = true;
                }
              }
              function exists(path) {
                try {
                  const cur = win._.get(c, path);
                  return cur && typeof cur === 'object' && Object.keys(cur).length > 0;
                } catch (e) { return false; }
              }

              let baseGrade = '';
              const assess = d.stages.find(function(s) { return s.type === 'assess'; });
              (assess ? assess.items : []).forEach(function(it) {
                if (it.kind !== 'kv') return;
                if (/难度/.test(it.k) && /评级|等级/.test(it.k) && !baseGrade) baseGrade = gradeFloor(it.v);
              });
              if (!baseGrade) {
                d.stages.forEach(function(s) {
                  s.items.forEach(function(it) {
                    if (it.kind === 'kv' && /难度/.test(it.k) && /评级|等级/.test(it.k) && !baseGrade) baseGrade = gradeFloor(it.v);
                  });
                });
              }
              if (!baseGrade) baseGrade = 'F';

              const relics = [];
              const golds = [];
              d.stages.forEach(function(s) {
                s.items.forEach(function(it) {
                  if (it.kind === 'relic' && it.name) relics.push(it);
                  if (it.kind === 'relicGold' && it.name) golds.push(it);
                });
              });
              const world = worldName || '';

              if (!isSingleWorldSettlement) {
              const achievementGrants = {};
              achievementTasks.forEach(function(x) {
                if (x.status !== '已达成') return;
                const r = parseAchievementReward(x.reward, world);
                if (!r) { console.warn('[结算美化] 无法识别成就奖励:', x.name, x.reward); return; }
                if (!achievementGrants[r.name]) achievementGrants[r.name] = { grade:r.grade, world:r.world, count:0 };
                achievementGrants[r.name].count++;
              });
              Object.keys(achievementGrants).forEach(function(name) {
                const g = achievementGrants[name], key = 'stat_data.角色.道具.' + name;
                const old = win._.get(c, key) || {};
                const currentQty = Number(old.数量) || 0;
                const baselineQty = achievementBaselineData
                  ? (Number(win._.get(achievementBaselineData, key + '.数量')) || 0)
                  : currentQty;
                const requiredQty = baselineQty + g.count;
                const missing = Math.max(0, requiredQty - currentQty);

                if (missing <= 0) return;

                const tags = Array.isArray(old.标签) ? old.标签.slice() : [];
                ['主神空间','盲盒',g.world].filter(Boolean).forEach(function(t) { if (tags.indexOf(t) < 0) tags.push(t); });
                win._.set(c, key + '.品质', g.grade);
                win._.set(c, key + '.类型', '盲盒');
                win._.set(c, key + '.数量', currentQty + missing);
                win._.set(c, key + '.标签', tags);
                win._.set(c, key + '.效果', old.效果 && typeof old.效果 === 'object' ? old.效果 : { 开启:'盲盒抽奖，打开后随机抽取「' + (g.world || '主神空间') + '」对应品质的奖励。' });
                win._.set(c, key + '.描述', old.描述 || '副本成就奖励。');
                win._.set(c, key + '.状态', [0,1,2].includes(Number(old.状态)) ? Number(old.状态) : 0);
                changed = true;
              });
              }

              if (credentialGrant) {
                const key = 'stat_data.角色.权限凭证.' + credentialGrant.grade;
                const currentQty = Math.max(0, Number(win._.get(c, key)) || 0);
                const baselineQty = settlementBaselineData
                  ? Math.max(0, Number(win._.get(settlementBaselineData, key)) || 0)
                  : currentQty;
                const requiredQty = baselineQty + 1;
                if (currentQty < requiredQty) {
                  win._.set(c, key, requiredQty);
                  changed = true;
                }
              }

              function parseEffectLines(txt) {
                const eff = {};
                if (!txt) return eff;
                txt.split('\n').map(function(x) { return x.trim(); }).filter(Boolean).forEach(function(ln) {
                  const nm = ln.match(/^\d+[.、]\s*(.+)$/);
                  const em = ln.match(/^[【\[]([^【】\[\]：:]{1,12})[】\]]\s*[：:]\s*(.+)$/);
                  const bm = ln.match(/^[【\[]([^【】\[\]：:]{1,12})[】\]]\s*(.+)$/);
                  if (nm && nm[1].indexOf('：') >= 0) {
                    const pm = nm[1].split('：');
                    eff[pm[0].trim()] = pm.slice(1).join('：').trim();
                  } else if (em) eff[em[1].trim()] = em[2].trim();
                  else if (nm && bm) eff[bm[1].trim()] = bm[2].trim();
                  else if (nm) eff['事迹' + (Object.keys(eff).length + 1)] = nm[1];
                  else if (bm) eff[bm[1].trim()] = bm[2].trim();
                  else {
                    const last = Object.keys(eff).pop();
                    if (last) eff[last] += ' ' + ln;
                    else eff['持有时'] = ln;
                  }
                });
                return eff;
              }

              golds.forEach(function(g) {
                if (!g.name || exists('stat_data.角色.装备.' + g.name)) return;
                const key = 'stat_data.角色.装备.' + g.name;
                win._.set(c, key + '.品质', baseGrade);
                win._.set(c, key + '.类型', 8);
                win._.set(c, key + '.标签', ['主神空间', g.origin || world].filter(Boolean));
                win._.set(c, key + '.原始属性', {});
                win._.set(c, key + '.效果', parseEffectLines(g.effect));
                win._.set(c, key + '.描述', g.desc || (world ? ('世界遗物, 来源: ' + world) : '世界遗物'));
                win._.set(c, key + '.消耗', '');
                win._.set(c, key + '.状态', 0);
                changed = true;
              });

              relics.forEach(function(r) {
                if (!r.name || exists('stat_data.角色.道具.' + r.name)) return;
                const key = 'stat_data.角色.道具.' + r.name;
                win._.set(c, key + '.品质', baseGrade);
                win._.set(c, key + '.类型', r.type || '纪念物');
                win._.set(c, key + '.数量', 1);
                win._.set(c, key + '.标签', ['主神空间', world].filter(Boolean));
                win._.set(c, key + '.效果', parseEffectLines(r.effect));
                win._.set(c, key + '.描述', r.desc || '');
                win._.set(c, key + '.状态', 0);
                changed = true;
              });

              if (isLatestPanel && isFullSettlement(rawText)) {
                const engine = win.Samsara && win.Samsara.worldEngine;
                if (engine) engine.cancel();
              }
              if (applySettlementFinalization(c, isLatestPanel)) changed = true;

              if (!changed) {
                if (settlementCoinMarkerPending !== null) {
                  writeSettlementCoinMessageMarker(win, targetMessageId, settlementCoinMarkerPending);
                }
                return;
              }
              await win.Mvu.replaceMvuData(c, { type: 'message', message_id: targetMessageId });

              if (isLatestPanel) {
                try { await win.Mvu.replaceMvuData(c, { type: 'chat' }); } catch (e3) {}
              }
              if (settlementCoinMarkerPending !== null) {
                writeSettlementCoinMessageMarker(win, targetMessageId, settlementCoinMarkerPending);
              }
            } catch (e) { console.warn('结算任务写入数据库失败:', e); }
            finally {
              settlementWriteBusy = false;
              if (settlementWritePending) { settlementWritePending = false; setTimeout(refreshTrialPanel, 0); }
            }
          }

          const btn = wrapper.querySelector('.st-btn');
          const rawDiv = wrapper.querySelector('.st-raw');
          const labelSpan = wrapper.querySelector('.st-label');
          const panelDiv = wrapper.querySelector('.st-panel');
          if (!btn || !rawDiv || !labelSpan || !panelDiv) return;

          const rawText = resolveSettlementRawText(rawDiv.textContent, window.parent || window);
          const d = parseSettlement(rawText);
          injectProgrammaticIncomeStage(d, spaceCoinSettlement);

          let worldName = '';
          const sm = (d.serial || '').match(/^Ω-(.+)-结算$/);
          if (sm) worldName = sm[1];
          labelSpan.textContent = worldName ? ('轮回清算 · ' + worldName) : '轮回清算协议';

          const hasStruct = d.title || d.serial || d.player ||
              d.stages.some(function(s) {
                return s.name || s.items.some(function(i) { return i.kind !== 'para'; });
              });
          panelDiv.innerHTML = hasStruct ? renderSettlement(d) : renderPlain(rawText);

          // 首次渲染只展示；待本楼 MVU 状态稳定后再执行程序结算与清理。

          function refreshTrialPanel() {
            refreshSettlementBaseline();
            refreshAchievementTasks();
            injectProgrammaticIncomeStage(d, spaceCoinSettlement);
            panelDiv.innerHTML = hasStruct ? renderSettlement(d) : renderPlain(rawText);
            const latest = readTrialTasks();
            if (latest.length) {
              // 不因AI漏写一项就缩小“全部试炼完成”的判定集合。
              const byKey = new Map(latest.map(function(task){return [task.key, task];}));
              const merged = trialTasks.map(function(task){const next=byKey.get(task.key);byKey.delete(task.key);return next || task;}).concat(Array.from(byKey.values()));
              const score = trialScore(merged);
              if (score >= bestTrialScore) {
                trialTasks = merged;
                bestTrialScore = score;
              }
            }
            // “重新处理变量”只触发 VARIABLE_UPDATE_ENDED 时，也重新执行幂等结算写入。
            if (hasStruct) writeSettlementToMvu(d, worldName);
            panelDiv.querySelectorAll('.st-trial-host').forEach(function(host) {
              host.innerHTML = renderTrialPanel();
            });
          }

          try {
            const ctx = getMvuContext();
            const win = ctx && ctx.win;
            const onFn = win && typeof win.eventOn === 'function' ? win.eventOn : (typeof eventOn === 'function' ? eventOn : null);
            const mvu = win && win.Mvu ? win.Mvu : (typeof Mvu !== 'undefined' ? Mvu : null);
            if (onFn && mvu && mvu.events && mvu.events.VARIABLE_UPDATE_ENDED) {
              onFn(mvu.events.VARIABLE_UPDATE_ENDED, function() { setTimeout(refreshTrialPanel, 0); });
            }
          } catch (e) {}
          setTimeout(refreshTrialPanel, 250);
          setTimeout(refreshTrialPanel, 600);

          setTimeout(function() {
            panelDiv.querySelectorAll('.st-stab-fill').forEach(function(el) {
              el.style.width = (el.getAttribute('data-w') || 0) + '%';
            });
          }, 60);

          panelDiv.querySelectorAll('.st-num-val').forEach(function(el) {
            const nm = el.textContent.match(/-?[\d,]+/);
            if (!nm) return;
            const target = parseCnNum(nm[0]);
            if (target == null) return;
            const dur = 900;
            const t0 = performance.now();
            (function tick(t) {
              const p = Math.min(1, (t - t0) / dur);
              const eased = 1 - Math.pow(1 - p, 3);
              el.textContent = fmtNum(target * eased);
              if (p < 1) requestAnimationFrame(tick);
            })(t0);
          });

          btn.addEventListener('click', function() {
            btn.classList.toggle('active');
            panelDiv.classList.toggle('show');
          });

        })();
      </script>
    </div>
    <!-- 替换模板结束 -->

</body>
</html>
