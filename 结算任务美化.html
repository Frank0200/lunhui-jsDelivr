            }).join('');
            const gradeHtml = decision.granted
              ? '<div class="st-kv"><span class="k">権限証憑等級</span><span class="v">' + gradeBadge(decision.grade, false) + '</span></div>'
              : '<div class="st-cert-status">今回、権限証憑は獲得できなかった</div>';
            const resultHtml = decision.granted
              ? '<div class="st-cert-desc">システム記録完了。今回【' + escapeHtml(decision.name) + '】×1を獲得。権限証憑は累積所持でき、源力注入による昇格の際に1枚ずつ消費する。</div>'
              : '';
            return '<div class="st-cert' + (decision.granted ? '' : ' no-grant') + '">' +
              '<div class="st-cert-title">◆ 主神権限証憑</div>' +
              gradeHtml + resultHtml +
              '<div class="st-cert-reasons">' + reasonHtml + '</div>' +
              '</div>';
          }

          function trialScore(tasks) {
            return (tasks || []).reduce(function(sum, task) {
              if (isSettlementTaskTerminal(task.status)) return sum + 3;
              if (task.status === '進行中') return sum + 1;
              return sum;
            }, 0);
          }

          let settlementBaselineData = readSettlementBaselineData();
          // 決算検証は決算前の任務スナップショットを優先し、現在の決算フロアの MVU スナップショットと EJS 生成済み結果が同期しないのを避ける。
          let trialTasks = extractTrialTasks(settlementBaselineData);
          if (!trialTasks.length) trialTasks = readTrialTasks();
          let bestTrialScore = trialScore(trialTasks);
          let settlementWriteBusy = false;
          let settlementWritePending = false;
          let settlementCoinWriteDone = false;
          let achievementTasks = readAchievementTasks();
          let bestAchievementScore = achievementTaskScore(achievementTasks);
          function readSettlementTaskKeys(data) {
            return settlementTaskKeysForData(data);
          }

          // 本文の変数で任務が既に消えていても、決算前スナップショットから検証する；本文の「已晋升」を完了状態の代わりにはしない。
          let settlementTaskKeys = readSettlementTaskKeys(settlementBaselineData);
          // 旧任務スナップショットの結果は、過去の未支給マークを安全に修復する用途にのみ残す；正式な金額にはもう使わない。
          let legacyRawSpaceCoinSettlement = calculateSpaceCoinSettlement(settlementBaselineData);
          let spaceCoinBaselineData = readSpaceCoinBaselineData();
          let rawSpaceCoinSettlement = calculateSpaceCoinSettlement(spaceCoinBaselineData);
          let settlementCoinBalanceBefore = readSettlementCoinBalanceBefore();
          let spaceCoinSettlement = rebaseSettlementCoinBalance(rawSpaceCoinSettlement, settlementCoinBalanceBefore);
          // 決算前のキャラクター階層を固定し、旧決算パネルが既に昇格済みの階層へ資格を重複付与するのを防ぐ。
          let settlementBaselineTier = readReincarnatorTier(settlementBaselineData);
          const credentialDecision = resolveCredentialDecision(settlementBaselineData);
          const credentialGrant = credentialDecision && credentialDecision.granted ? credentialDecision : null;

          function refreshSettlementBaseline() {
            const candidate=readSettlementBaselineData();
            const preferred=preferSettlementSnapshot(settlementBaselineData,candidate);
            if (preferred) settlementBaselineData=preferred;
            settlementTaskKeys=readSettlementTaskKeys(settlementBaselineData);
            legacyRawSpaceCoinSettlement=calculateSpaceCoinSettlement(settlementBaselineData);
            spaceCoinBaselineData=readSpaceCoinBaselineData();
            rawSpaceCoinSettlement=calculateSpaceCoinSettlement(spaceCoinBaselineData);
            if (settlementCoinBalanceBefore === null) settlementCoinBalanceBefore=readSettlementCoinBalanceBefore();
            spaceCoinSettlement=rebaseSettlementCoinBalance(rawSpaceCoinSettlement, settlementCoinBalanceBefore);
            settlementBaselineTier=readReincarnatorTier(settlementBaselineData);
            const nextTrials=extractTrialTasks(settlementBaselineData);
            if (nextTrials.length) {
              const score=trialScore(nextTrials);
              if (score>=bestTrialScore) { trialTasks=nextTrials; bestTrialScore=score; }
            }
          }

          function isTrialPassed(tasks) {
            return tasks.length > 0 && tasks.every(function(task) { return isSettlementTaskSuccessful(task.status); });
          }

          function inferTrialTasksFromSettlement(text) {
            const source = String(text || '');
            const rewards = {};
            const re = /【?(?:昇格試練|晋升试炼)[·.]\s*(\d+)】?\s*[：:]\s*([^\n]+)/g;
            let m;
            let maxNo = 0;
            while ((m = re.exec(source)) !== null) {
              const no = parseInt(m[1], 10);
              if (!Number.isFinite(no) || no <= 0) continue;
              rewards[no] = String(m[2] || '').trim();
              maxNo = Math.max(maxNo, no);
            }
            if (!maxNo) return [];
            const out = [];
            for (let no = 1; no <= maxNo; no++) {
              out.push({
                key: 'replay-' + no,
                name: '昇格試練·' + no,
                status: rewards[no] ? '決算可能' : '進行中',
                replay: true
              });
            }
            return out;
          }

          function renderTrialPanel() {
            const live = trialTasks.length > 0;
            const displayTasks = live ? trialTasks : inferTrialTasksFromSettlement(rawText);
            if (!displayTasks.length) return '';
            const done = displayTasks.filter(function(task) { return isSettlementTaskSuccessful(task.status); }).length;
            const displayPassed = displayTasks.every(function(task) { return isSettlementTaskSuccessful(task.status); });
            const passed = live && isTrialPassed(trialTasks);
            const pct = Math.round(done / displayTasks.length * 100);
            let html = '<div class="st-trial-check' + (displayPassed ? '' : ' pending') + '">';
            html += '<div class="st-trial-head"><div class="st-trial-title">◆ 昇格試練決算検証</div><div class="st-trial-count">' + done + ' / ' + displayTasks.length + '</div></div>';
            displayTasks.forEach(function(task) {
              let cls = 'wait';
              let label = task.status || '未設定';
              if (isSettlementTaskSuccessful(task.status)) { cls = 'ok'; label = '完了'; }
              else if (isSettlementTaskFailed(task.status)) { cls = 'bad'; label = '失敗'; }
              else if (task.status === '進行中') { label = '未完了'; }
              html += '<div class="st-trial-row"><div class="st-trial-name">' + escapeHtml(task.name) + '</div><div class="st-trial-state ' + cls + '">' + escapeHtml(label) + '</div></div>';
            });
            html += '<div class="st-trial-bar"><div class="st-trial-fill" style="width:' + pct + '%"></div></div>';
            html += '<div class="st-trial-result"><div class="st-trial-stamp ' + (passed ? 'pass' : 'fail') + '">' + (passed ? '試練完了 · ステータスバーで昇格開始をクリック' : !live ? '本文結果は変数検証待ち' : displayTasks.some(function(task){return task.status === '失败';}) ? '試練未達成' : '試練任務の決算待ち') + '</div></div>';
            html += '</div>';
            return html;
          }

          function renderAchievementPanel() {
            if (!achievementTasks.length) return '';
            const done = achievementTasks.filter(function(x) { return isAchievedStatus(x.status); }).length;
            const pct = Math.round(done / achievementTasks.length * 100);
            let html = '<div class="st-trial-check pending">';
            html += '<div class="st-trial-head"><div class="st-trial-title" style="color:#f5d76e">✦ 副本実績決算</div><div class="st-trial-count">' + done + ' / ' + achievementTasks.length + '</div></div>';
            achievementTasks.forEach(function(x) {
              const ok = isAchievedStatus(x.status);
              html += '<div class="st-trial-row"><div class="st-trial-name"><b>' + escapeHtml((x.difficulty ? x.difficulty + ' · ' : '') + x.name) + '</b>';
              if (x.desc) html += '<div style="margin-top:2px;color:#8fa0b3;font-size:.9em;white-space:normal">' + escapeHtml(x.desc) + '</div>';
              if (x.reward) html += '<div style="margin-top:2px;color:#d6c791;font-size:.9em;white-space:normal">🎁 ' + escapeHtml(x.reward) + '</div>';
              html += '</div><div class="st-trial-state ' + (ok ? 'ok' : 'wait') + '">' + (ok ? '達成済み' : '未達成') + '</div></div>';
            });
            html += '<div class="st-trial-bar"><div class="st-trial-fill" style="width:' + pct + '%;background:linear-gradient(90deg,#f97316,#f5d76e)"></div></div>';
            html += '<div class="st-note" style="text-align:center">' + (done ? ('達成済み ' + done + ' 項、実績ブラインドボックスは今回の決算で一括付与される。') : '今回、実績ブラインドボックスの付与はない。') + '</div></div>';
            return html;
          }

          function refreshAchievementTasks() {
            const latest=readAchievementTasks();
            const preferred=preferAchievementTasks(achievementTasks,latest);
            const score=achievementTaskScore(preferred);
            if (score>=bestAchievementScore) {
              achievementTasks=preferred;
              bestAchievementScore=score;
            }
            panelDiv.querySelectorAll('.st-achievement-host').forEach(function(host) {
              host.innerHTML=renderAchievementPanel();
            });
          }

          function sanitizeMvuObjectKey(value) {
            return String(value || '')
              .replace(/[.\/\\]+/g, '·')
              .replace(/·{2,}/g, '·')
              .replace(/^·+|·+$/g, '')
              .trim();
          }

          function parseAchievementReward(reward, fallbackWorld) {
            const v = String(reward || '').trim();
            let m = v.match(/^(SSS|SS|S|A|B|C|D|E|F)\s*(?:級ブラインドボックス|级盲盒)\s*[·・]\s*(.+)$/i);
            if (!m) m = v.match(/^(SSS|SS|S|A|B|C|D|E|F)\s*(?:級ブラインドボックス|级盲盒)\s*[（(]\s*([^）)]*)\s*[）)]$/i);
            if (!m) m = v.match(/^(SSS|SS|S|A|B|C|D|E|F)\s*(?:級ブラインドボックス|级盲盒)\s*$/i);
            if (!m) return null;
            const grade = gradeTier(m[1]);
            const world = String(m[2] || fallbackWorld || '').replace(/[【】《》]/g, '').trim();
            const safeWorldKey = sanitizeMvuObjectKey(world);
            return { grade:grade, world:world, name:grade + '級ブラインドボックス' + (safeWorldKey ? '·' + safeWorldKey : '') };
          }

          /* B1_SETTLEMENT_HEADING_COMPAT: 旧チャット/旧AI出力の決算見出しを正規見出しへ読み替える。入力境界専用・冪等。 */
          var SETTLEMENT_HEADING_ALIASES = [
            ['轮回清算协议', '輪廻清算プロトコル'],
            ['世界因果与综合评估', '世界因果と総合評価'],
            ['因果烙印与干涉回放', '因果の烙印と干渉の再生'],
            ['因果演进与世界暗流', '因果の進展と世界の暗流']
          ];
          var SETTLEMENT_KEY_ALIASES = {
            '判定依据': '判定根拠',
            '判定结果': '判定結果',
            '获得': '獲得',
            '获得物品': '獲得物品',
            'タイプ': 'タイプ',
            '効果': '効果',
            '説明': '説明',
            '出典': '出典',
            '系统评述': 'システム評述',
            '世界传闻': '世界の噂',
            '高光回放': 'ハイライト再生',
            '任务专属奖励': '任務専用報酬',
            '副本烙印': 'インスタンスの烙印',
            '协议序列': 'プロトコル序列',
            '提示': 'ヒント',
            '世界结晶': '世界結晶',
            '世界遗物': '世界遺物',
            '世界遗物特别嘉奖': '世界遺物・特別褒賞',
            '纪念物': '記念品'
          };
          function normalizeLegacySettlementHeading(name) {
            var s = String(name == null ? '' : name);
            for (var i = 0; i < SETTLEMENT_HEADING_ALIASES.length; i++) {
              var legacy = SETTLEMENT_HEADING_ALIASES[i][0], canon = SETTLEMENT_HEADING_ALIASES[i][1];
              if (s.indexOf(legacy) >= 0) s = s.split(legacy).join(canon);
            }
            return s;
          }
          function normalizeLegacySettlementKey(key) {
            var k = String(key == null ? '' : key).trim();
            return Object.prototype.hasOwnProperty.call(SETTLEMENT_KEY_ALIASES, k) ? SETTLEMENT_KEY_ALIASES[k] : k;
          }
          function parseSettlement(text) {
            const out = { title: '', serial: '', player: '', stages: [] };
            const lines = String(text).replace(/\r/g, '').split('\n');
            let inNote = false;
            let curStage = null;
            let curSub = '';
            let cardSec = '';

            function classifyStage(name) {
              const n = String(name || '');
              if (/評価|评估|難易度|难度|安定|稳定/.test(n)) return 'assess';
              if (/烙印|回放|再生|传闻|噂|风格/.test(n)) return 'story';
              if (/法则|战利品|遗物|遺物/.test(n)) return 'loot';
              if (/收益|核算|スペースコイン|空间币/.test(n)) return 'income';
              if (/演进|暗流|最终|因果/.test(n)) return 'epilogue';
              return 'generic';
            }

            function newStage(name) {
              curStage = { name: name, type: classifyStage(name), items: [] };
              out.stages.push(curStage);
              curSub = '';
              cardSec = '';
            }

            function push(kind, data) {
              if (!curStage) newStage('');
              curStage.items.push(Object.assign({ kind: kind, sub: curSub }, data));
            }

            for (let i = 0; i < lines.length; i++) {
              const isList = /^\s*[*+-]\s+/.test(lines[i]);
              let line = lines[i].trim();
              if (!line) continue;
              if (line.startsWith('>')) line = line.replace(/^>\s*/, '').trim();
              if (!line) continue;
              if (inNote) { if (/\)\s*$/.test(line)) inNote = false; continue; }
              if (/^\$\(\s*(注|若)/.test(line)) { if (!/\)\s*$/.test(line)) inNote = true; continue; }
              if (/^<\/?(settlement tasks|System_Rules|dm_think)/i.test(line)) continue;

              let m;
              if ((m = line.match(/^####(?!#)\s*(.+)$/))) { newStage(normalizeLegacySettlementHeading(stripDecor(m[1]).replace(/^【|】$/g, ''))); continue; }
              if ((m = line.match(/^#{1,3}(?!#)\s*(.+)$/))) { out.title = normalizeLegacySettlementHeading(stripDecor(m[1]).replace(/^【|】$/g, '')); continue; }
              if ((m = line.match(/^\*{0,2}\[?\s*(?:プロトコル序列|协议序列)\s*\]?\*{0,2}\s*[：:]\s*(.+)$/))) { out.serial = stripDecor(m[1]); continue; }
              if ((m = line.match(/^\*{0,2}\[?\s*(?:輪廻者|轮回者)\s*\]?\*{0,2}\s*[：:]\s*(.+)$/))) { out.player = stripDecor(m[1]); continue; }

              let body = isList ? line.replace(/^\s*[*+-]\s+/, '').trim() : line;
              body = body.replace(/^\$\((.+?)\)\s*[：:]\s*/, '\u0024' + '1：');

              if (/^[\*【]*(?:ヒント|提示)[：:]/.test(body)) { push('notice', { text: stripDecor(body.replace(/^[\*【]*(?:ヒント|提示)[：:]?\s*/, '').replace(/[\*】]*$/, '')) }); curSub = ''; continue; }
              if ((m = body.match(/^\*{0,2}(?:インスタンスの烙印|副本烙印)\s*[｜|]?\s*(.+)$/))) { push('brand', { name: stripDecor(m[1]) }); continue; }
              if (/主神权限凭证/.test(body) && body.replace(/\*/g, '').length < 30) { curSub = '主神权限凭证'; cardSec = ''; push('cert', {}); continue; }
              if (/(?:世界結晶|世界结晶)/.test(body) && body.replace(/[*【】（）()：:]/g, '').length < 30) { curSub = '世界結晶'; cardSec = ''; push('relic', { label: '世界結晶 · クリア記念品', name: '', type: '', effect: '', desc: '' }); continue; }
              if (/(?:世界遺物・特別褒賞|世界遗物特别嘉奖)/.test(body) && body.replace(/\*/g, '').length < 30) { curSub = '世界遺物'; cardSec = ''; push('relicGold', { label: '世界遺物 · 特別褒賞', name: '', type: '', effect: '', desc: '', origin: '' }); continue; }

              if ((m = body.match(/^\*{0,2}[【\[]?([^*【】\[\]：:]{2,16})[】\]]?\*{0,2}\s*[：:]\s*$/))) {
                const subName = normalizeLegacySettlementKey(m[1].trim());
                if (!/判定根拠|判定結果|^獲得$|獲得物品|检定源|^结果$/.test(subName)) { curSub = subName; push('sub', { name: subName }); continue; }
              }

              if (curStage && curStage.type === 'income' && /×/.test(body) && /=/.test(body)) {
                let src = '', formula = body.replace(/\*\*/g, '');
                let sm2 = formula.match(/^\[([^\]]+)\]\s*(.+)$/);
                if (!sm2) sm2 = formula.match(/^[^×\[]+×\s*\[([^\]]+)\]\s*(.+)$/);
                if (sm2) { src = sm2[1].trim(); formula = sm2[2].trim(); }
                else { const bm = formula.match(/\[([^\]]+)\]/); if (bm) src = bm[1]; }
                push('calc', { src: src, formula: formula, result: formula.split('=').pop().trim() });
                continue;
              }

              if (curStage && curStage.type === 'loot' && /(?:産地|产地)/.test(body)) {
                const cm = body.match(/^(.+?)\s*[（(]\s*(?:産地|产地)[：:]\s*([^）)]+)[）)]\s*[：:]?\s*(.*)$/);
                if (cm) { push('lootItem', { name: stripDecor(cm[1]), origin: cm[2].trim(), note: stripDecor(cm[3]) }); continue; }
              }

              if ((m = body.match(/^[\(*]*(?:倉庫物品の検出|检测仓库物品)[：:]?\s*(.+?)\)*$/))) { push('warehouse', { text: m[1].replace(/[\)*]+$/, '').trim() }); continue; }

              if (curStage && (curSub === '世界結晶' || curSub === '世界遺物')) {
                const secM = stripDecor(body).match(/^(判定依据|判定结果|获得|获得物品|判定根拠|判定結果|獲得|獲得物品)[：:]?$/);
                if (secM) {
                  const secKey = normalizeLegacySettlementKey(secM[1]);
                  if (secKey === '判定根拠' || secKey === '判定結果') { cardSec = 'reasons'; push('reasonHead', { text: secKey }); }
                  else cardSec = 'item';
                  continue;
                }
                if (cardSec === 'reasons') {
                  const card = curStage.items.filter(function(x) { return x.kind === (curSub === '世界結晶' ? 'relic' : 'relicGold') && x.sub === curSub; }).pop();
                  const plainR = stripDecor(body);
                  if (card && plainR && !/[：:]/.test(plainR) && plainR.length <= 40) { card.reasons = (card.reasons || []).concat(plainR); push('reason', { text: plainR }); continue; }
                }
              }


              if ((m = body.match(/^\*{0,2}[【\[]?([^*【】\[\]：:]{1,22})[】\]]?\*{0,2}\s*[：:]\s*(.+)$/))) {
                const k = normalizeLegacySettlementKey(m[1].trim());
                const v = stripDecor(m[2]);

                if (curSub === '世界結晶' || curSub === '世界遺物') {
                  if (k === '判定根拠') cardSec = 'reasons';
                  else if (k === '獲得' || k === '獲得物品') cardSec = 'item';
                  else cardSec = '';
                }

                if (curStage && (curSub === '世界結晶' || curSub === '世界遺物') && /^\d+[.、]/.test(k)) {
                  const card = curStage.items.filter(function(x) { return x.kind === (curSub === '世界結晶' ? 'relic' : 'relicGold') && x.sub === curSub; }).pop();
                  if (card) { card.effect = (card.effect ? card.effect + '\n' : '') + k + '：' + v; push('para', { text: k + '：' + v }); continue; }
                }

                if (curStage && curStage.type === 'income' && /合计|上限|实际计入/.test(k)) { push('sum', { name: k, v: v }); continue; }
                if (/总收益/.test(k)) { const nm = v.match(/-?[\d,，\.]+\s*万?/); push('total', { num: nm ? parseCnNum(nm[0]) : null, text: v, debt: /负债/.test(v) }); continue; }
                if (/稳定|安定/.test(k) && /→|->/.test(v)) { const pm = v.match(/(\d+(?:\.\d+)?)\s*%\s*(?:→|->)\s*(\d+(?:\.\d+)?)\s*%/); if (pm) { push('stab', { from: parseFloat(pm[1]), to: parseFloat(pm[2]) }); continue; } }
                if (/^注/.test(k)) { push('note', { text: k + '：' + v }); continue; }
                if (curStage && curStage.type === 'income' && isList && !/^注/.test(k) && /->|→|强制执行(?:惩罚|罰則)/.test(v)) { push('punish', { name: k.replace(/[[\]]/g, ''), desc: v.replace(/^强制执行(?:惩罚|罰則)\s*(?:->|→)?\s*/, '') }); continue; }
                if (curStage && curStage.type === 'story' && isList && curSub && /ハイライト|再生|高光|回放/.test(curSub)) { push('hl', { t: k, d: v }); continue; }

                if (curStage && (curSub === '世界結晶' || curSub === '世界遺物')) {
                  const card = curStage.items.filter(function(x) { return x.kind === (curSub === '世界結晶' ? 'relic' : 'relicGold') && x.sub === curSub; }).pop();
                  if (card) {
                    if (k === '獲得物品' || k === '獲得') card.name = v.replace(/^[【[]|[】\]]$/g, '').trim() || v;
                    else if (k === 'タイプ') card.type = v;
                    else if (k === '効果') card.effect = (card.effect ? card.effect + '\n' : '') + v;
                    else if (k === '説明') card.desc = v;
                    else if (k === '出典') card.origin = v;
                  }
                }
                push('kv', { k: k, v: v });
                continue;
              }

              const plainBody = stripDecor(body);
              if (!/[：:]/.test(plainBody) && plainBody.length < 60 && /未|无/.test(plainBody) && /惩罚|罰則|失败|获得|獲得|遗物|检测|压缩|抵扣/.test(plainBody)) { push('empty', { text: plainBody }); continue; }
              if (/^【.*(?:完了|完毕).*】$/.test(stripDecor(body))) { push('closing', { text: stripDecor(body) }); continue; }

              if (curStage && (curSub === '世界結晶' || curSub === '世界遺物') && /^\d+[.、]\s*\S/.test(stripDecor(body))) {
                const card = curStage.items.filter(function(x) { return x.kind === (curSub === '世界結晶' ? 'relic' : 'relicGold') && x.sub === curSub; }).pop();
                if (card) { card.effect = (card.effect ? card.effect + '\n' : '') + stripDecor(body); push('para', { text: stripDecor(body) }); continue; }
              }
              if (curStage && (curSub === '世界結晶' || curSub === '世界遺物')) {
                const card = curStage.items.filter(function(x) { return x.kind === (curSub === '世界結晶' ? 'relic' : 'relicGold') && x.sub === curSub; }).pop();
                const plain0 = stripDecor(body);
                if (card && !card.name && plain0 && !/[：:]/.test(plain0) && (cardSec === 'item' || /^[【\[]/.test(plain0)) && plain0.replace(/^[【[]|[】\]]$/g, '').trim().length <= 30) card.name = plain0.replace(/^[【[]|[】\]]$/g, '').trim();
              }
              push('para', { text: stripDecor(body) });
            }
            return out;
          }

          function buildProgrammaticIncomeItems(result) {
            const items = [];
            function sub(name) { items.push({ kind:'sub', sub:'', name:name }); }
            function sum(name, value) { items.push({ kind:'sum', sub:'', name:name, v:fmtNum(value) + ' スペースコイン' }); }

            sub('主神/试炼任务保底スペースコイン');
            if (result.taskRewardDetails.length) {
              result.taskRewardDetails.forEach(function(x) {
                items.push({ kind:'kv', sub:'主神/试炼任务保底スペースコイン', k:'[' + x.name + ']', v:fmtNum(x.amount) + ' スペースコイン' });
              });
            } else {
              items.push({ kind:'empty', sub:'主神/试炼任务保底スペースコイン', text:'今回、成功任務のスペースコイン報酬はない' });
            }
            sum('任務スペースコイン合計', result.taskReward);

            sub('击杀目标附加收益明细');
            if (result.killDetails.length) {
              result.killDetails.forEach(function(x) {
                items.push({ kind:'calc', sub:'击杀目标附加收益明细', src:x.tier, formula:fmtNum(x.count) + ' × ' + fmtNum(x.unit), result:fmtNum(x.subtotal) + ' スペースコイン' });
              });
            } else {
              items.push({ kind:'empty', sub:'击杀目标附加收益明细', text:'今回、キル収益はない' });
            }
            sum('キル報酬合計', result.killRaw);
            sum('キル報酬上限', result.killCap);
            sum('キル計入済み収益', result.killReward);

            if (!result.isSingleWorld) {
              sub('世界探索附加收益明细');
              if (result.explorationDetails.length) {
                result.explorationDetails.forEach(function(x) {
                  items.push({ kind:'calc', sub:'世界探索附加收益明细', src:x.name, formula:fmtNum(result.base) + ' × 50%', result:fmtNum(x.subtotal) + ' スペースコイン' });
                });
              } else {
                items.push({ kind:'empty', sub:'世界探索附加收益明细', text:'今回、探索収益はない' });
              }
              sum('探索報酬合計', result.explorationRaw);
              sum('探索報酬上限', result.explorationCap);
              sum('探索計入済み収益', result.explorationReward);

              sub('势力羁绊附加收益明细');
              if (result.reputationDetails.length) {
                result.reputationDetails.forEach(function(x) {
                  items.push({ kind:'calc', sub:'势力羁绊附加收益明细', src:x.name, formula:fmtNum(result.base) + ' × (' + x.reputation + ' ÷ 100)', result:fmtNum(x.subtotal) + ' スペースコイン' });
                });
              } else {
                items.push({ kind:'empty', sub:'势力羁绊附加收益明细', text:'今回、正の声望収益はない' });
              }
              sum('声望報酬合計', result.reputationRaw);
              sum('声望報酬上限', result.reputationCap);
              sum('声望計入済み収益', result.reputationReward);
            }

            if (result.penaltyDetails.length) {
              sub('失敗/未完了スペースコイン罰則');
              result.penaltyDetails.forEach(function(x) {
                items.push({ kind:'punish', sub:'失敗/未完了スペースコイン罰則', name:x.name, desc:'控除 ' + fmtNum(x.amount) + ' スペースコイン' });
              });
              sum('スペースコイン罰則合計', -result.penalty);
            }

            items.push({ kind:'total', sub:'', num:result.totalReward, text:fmtNum(result.totalReward) + ' スペースコイン', debt:result.balanceAfter < 0 });
            items.push({ kind:'sum', sub:'', name:'決算後残高', v:fmtNum(result.balanceBefore) + ' → ' + fmtNum(result.balanceAfter) + ' スペースコイン' });
            return items;
          }

          function injectProgrammaticIncomeStage(d, result) {
            let stage = d.stages.find(function(s) { return s.type === 'income'; });
            if (!stage) {
              stage = { name:'スペースコイン収益計算', type:'income', items:[] };
              const epilogueIndex = d.stages.findIndex(function(s) { return s.type === 'epilogue'; });
              if (epilogueIndex >= 0) d.stages.splice(epilogueIndex, 0, stage);
              else d.stages.push(stage);
            }
            // SETTLEMENT_LEGACY_INCOME_CLEANUP
            const legacyIncomeSubs = new Set(['击杀目标附加收益明细','世界探索附加收益明细','势力羁绊附加收益明细']);
            const aiNonCoinItems = (stage.items || []).filter(function(item) {
              if (item.kind === 'calc' || item.kind === 'sum' || item.kind === 'total') return false;
              const legacySub = String(item && item.sub || '').trim();
              const legacyName = String(item && item.name || '').trim();
              if (legacyIncomeSubs.has(legacySub) || legacyIncomeSubs.has(legacyName)) return false;
              try { if (/スペースコイン|空间币/.test(JSON.stringify(item))) return false; } catch (e) {}
              return true;
            });
            stage.items = buildProgrammaticIncomeItems(result).concat(aiNonCoinItems);
          }

          function gradeBadge(v, reincarnator) {
            const t = gradeTier(v);
            return '<span class="st-grade g-' + t + (reincarnator ? ' reincarnator' : '') + '">' + escapeHtml(t) + '</span>';
          }

          function rateRow(k, v) {
            const gm = String(v).trim().match(/^([A-Za-z]{1,3})\s*[-~—–]\s*([A-Za-z]{1,3})$/);
            if (gm && GRADES.indexOf(gm[1].toUpperCase()) >= 0 && GRADES.indexOf(gm[2].toUpperCase()) >= 0) {
              return '<div class="st-rate-row"><span class="k">' + escapeHtml(k) + '</span>' +
                  '<span class="st-grade g-' + gradeTier(gm[1]) + '">' + escapeHtml(gm[1].toUpperCase()) + '</span>' +
                  '<span class="st-grade wave">~</span>' +
                  '<span class="st-grade g-' + gradeTier(gm[2]) + '">' + escapeHtml(gm[2].toUpperCase()) + '</span></div>';
            }
            return '<div class="st-rate-row"><span class="k">' + escapeHtml(k) + '</span>' + gradeBadge(v, /表现/.test(k)) + '</div>';
          }

          function renderItem(it, st) {
            switch (it.kind) {
              case 'sub': return '<div class="st-sub">' + escapeHtml(it.name) + '</div>';
              case 'kv': {
                const k = it.k, v = it.v;
                if (/评级|等级|难度|基准/.test(k) && /^[A-Za-z]{1,3}$/.test(v.trim()) && GRADES.indexOf(v.trim().toUpperCase()) >= 0) return rateRow(k, v);
                if (/难度|评级/.test(k) && /^[A-Za-z]{1,3}\s*[-~—–]\s*[A-Za-z]{1,3}$/.test(v.trim())) return rateRow(k, v);
                if ((k === '獲得物品' || k === '獲得') && /^【.+】$/.test(v)) return '<div class="st-relic-name">' + escapeHtml(v) + '</div>';
                if (k === '判定結果') { const okV = /充足|授与|满足|授予/.test(v) && !/未獲得|未获得/.test(v); return '<div class="st-verdict ' + (okV ? 'ok' : 'no') + '">' + (okV ? '✔ ' : '✕ ') + escapeHtml(v) + '</div>'; }
                if (k === '説明' && /[“”"]/.test(v)) return '<div class="st-relic-quote">' + escapeHtml(v) + '</div>';
                if (k === '効果' && /事迹留存/.test(v)) return '<div class="st-kv effect"><span class="k">' + escapeHtml(k) + '</span><span class="v">' + escapeHtml(v) + '</span></div>';
                if (/(?:評述|评述)/.test(k)) return '<div class="st-comment">' + escapeHtml(v) + '</div>';
                if (st && st.type === 'income' && /奖励|報酬|收益/.test(k)) return '<div class="st-kv income-v"><span class="k">' + escapeHtml(k) + '</span><span class="v">' + escapeHtml(v) + '</span></div>';
                return '<div class="st-kv"><span class="k">' + escapeHtml(k) + '</span><span class="v">' + escapeHtml(v) + '</span></div>';
              }
              case 'reasonHead': return '<div class="st-reason-head">' + escapeHtml(it.text) + '</div>';
              case 'reason': return '<div class="st-reason">' + escapeHtml(it.text) + '</div>';
              case 'stab': { const width = Math.max(0, Math.min(100, Number(it.to) || 0)); return '<div class="st-stab"><div class="st-stab-label"><span>世界安定値変動</span><span><b>100%</b> → <b>' + it.to + '%</b></span></div><div class="st-stab-bar"><div class="st-stab-fill" data-w="' + width + '" style="width:' + width + '%"></div></div></div>'; }
              case 'brand': return '<div class="st-brand"><div class="st-brand-label">イ ン ス タ ン ス 刻 印</div><div class="st-brand-name">' + escapeHtml(it.name) + '</div></div>';
              case 'hl': return '<div class="st-tl-item"><span class="t">' + escapeHtml(it.t) + '</span>' + (it.d ? '<span class="d">：' + escapeHtml(it.d) + '</span>' : '') + '</div>';
              case 'calc': {
                const tier = (String(it.src).match(/[ⅠⅡⅢⅣⅤⅥⅦⅧⅨ]/) || [''])[0];
                const srcTxt = tier ? (tier + '級目標') : (it.src || '収益項目');
                return '<div class="st-calc-row"><span class="st-calc-src">[' + escapeHtml(srcTxt) + ']</span><span class="st-calc-formula">' + escapeHtml(it.formula) + '</span><span class="st-calc-sum">= ' + escapeHtml(it.result) + '</span></div>';
              }
              case 'punish': return '<div class="st-punish"><span class="t">⚠ ' + escapeHtml(it.name) + '</span><span class="d">' + escapeHtml(it.desc) + '</span></div>';
              case 'sum': return '<div class="st-sum-row' + (/计入/.test(it.name) ? ' final' : '') + '"><span class="k">' + escapeHtml(it.name) + '</span><span class="v">' + escapeHtml(it.v) + '</span></div>';
              case 'total': {
                const neg = it.num != null && it.num < 0;
                const numText = it.num != null ? fmtNum(it.num) : it.text;
                return '<div class="st-total' + (neg ? ' neg' : '') + '"><div class="st-total-label">個 人 最 終 総 収 益</div><div class="st-total-num"><span class="st-num-val">' + escapeHtml(numText) + '</span><span class="unit">スペースコイン</span></div>' + (it.debt ? '<div class="st-total-debt">⚠ 残高不足 · 口座が負債状態に · 主神空間から離脱する前に強制返済が必要</div>' : '') + '<div class="st-total-done">決 算 完 了</div></div>';
              }
              case 'note': return '<div class="st-note">※ ' + escapeHtml(it.text) + '</div>';
              case 'notice': return '<div class="st-notice">◈ ' + escapeHtml(it.text) + '</div>';
              case 'empty': return '<div class="st-empty">' + escapeHtml(it.text) + '</div>';
              case 'warehouse': return '<div class="st-warehouse">📦 倉庫検査：' + escapeHtml(it.text) + '</div>';
              case 'lootItem': {
                const tm = String(it.note || '').match(/[【\[]([^】\]]+)[】\]]/);
                const badge = tm ? tm[1] : it.note;
                return '<div class="st-loot-item"><span class="n">' + escapeHtml(it.name) + '</span><span class="d"> (産地: ' + escapeHtml(it.origin) + ')</span>' + (badge ? '<span class="compress">⚡ ' + escapeHtml(badge) + '</span>' : '') + '</div>';
              }
              case 'closing': return '<div class="st-closing">' + escapeHtml(it.text) + '</div>';
              case 'para': {
                const t = it.text;
                const sub = it.sub || '';
                if (/^【.+】$/.test(t)) return '<div class="st-relic-name">' + escapeHtml(t) + '</div>';
                if (/凭证/.test(sub)) return '<div class="st-cert-desc">' + escapeHtml(t) + '</div>';
                if (/遗物/.test(sub)) return '<div class="st-note">' + escapeHtml(t) + '</div>';
                if (/噂/.test(sub)) return '<div class="st-tl-item rumor"><span class="d">' + escapeHtml(t) + '</span></div>';
                return '<div class="st-para">' + escapeHtml(t) + '</div>';
              }
              default: return '';
            }
          }

          function renderSettlement(d) {
            let html = '';
            let achievementInserted = false;
            let credentialInserted = false;
            const hasLegacyCredentialPanel = d.stages.some(function(stage) {
              return stage.items.some(function(item) { return item.kind === 'cert'; });
            });
            html += '<div class="st-banner"><div class="st-banner-main">' + escapeHtml(d.title || '主神空間 · 輪廻清算プロトコル') + '</div><div class="st-banner-tags">';
            if (d.serial) html += '<span class="st-tag">プロトコルシリアル <b>' + escapeHtml(d.serial) + '</b></span>';
            if (d.player) html += '<span class="st-tag">輪廻者 <b>' + escapeHtml(d.player) + '</b></span>';
            html += '</div></div>';

            d.stages.forEach(function(st, idx) {
              if (!st.items.length) return;
              let inner = '';
              const items = st.items;
              let i = 0;
              let rewardSeen = false;
              let trialInserted = false;

              while (i < items.length) {
                const it = items[i];

                if (it.kind === 'sub' && /(?:任務専用報酬|任务专属奖励)/.test(it.name || '')) rewardSeen = true;
                if (rewardSeen && !trialInserted && it.kind === 'sub' && !/(?:任務専用報酬|任务专属奖励)/.test(it.name || '') && (trialTasks.length || /(?:昇格試練|晋升试炼)[·\.]/.test(rawText))) {
                  inner += '<div class="st-trial-host">' + renderTrialPanel() + '</div>';
                  trialInserted = true;
                }

                if (it.kind === 'kv' && /(?:任務専用報酬|任务专属奖励)/.test(it.sub || '')) {
                  let rows = '';
                  while (i < items.length && items[i].kind === 'kv' && /(?:任務専用報酬|任务专属奖励)/.test(items[i].sub || '')) {
                    const reward = items[i];
                    const valueClass = /已发放|获得|到账/.test(reward.v || '') ? ' reward-ok' : '';
                    rows += '<div class="st-sum-row"><span class="k">' + escapeHtml(reward.k) + '</span><span class="v' + valueClass + '">' + escapeHtml(reward.v) + '</span></div>';
                    i++;
                  }
                  inner += '<div class="st-sum-rows st-task-reward-box">' + rows + '</div>';
                  continue;
                }

                if (it.kind === 'sum') {
                  let rows = '';
                  while (i < items.length && items[i].kind === 'sum') { rows += renderItem(items[i], st); i++; }
                  inner += '<div class="st-sum-rows">' + rows + '</div>';
                  continue;
                }

                if (it.kind === 'cert' || it.kind === 'relic' || it.kind === 'relicGold') {
                  const cardSub = it.sub;
                  i++;
                  let card = '';
                  while (i < items.length && (items[i].kind === 'kv' || items[i].kind === 'para' || items[i].kind === 'reasonHead' || items[i].kind === 'reason') && items[i].sub === cardSub) {
                    card += renderItem(items[i], st);
                    i++;
                  }
                  if (!card) card = '<div class="st-cert-desc">システム記録完了。</div>';
                  if (it.kind === 'cert') inner += '<div class="st-cert"><div class="st-cert-title">◆ 主神権限証憑</div>' + card + '</div>';
                  else if (it.kind === 'relic') inner += '<div class="st-relic"><div class="st-relic-label">' + escapeHtml(it.label || '世界結晶') + '</div>' + card + '</div>';
                  else inner += '<div class="st-relic gold"><div class="st-relic-label">' + escapeHtml(it.label || '世界遺物') + '</div>' + card + '</div>';
                  continue;
                }

                inner += renderItem(it, st);
                i++;
              }

              if (rewardSeen && !trialInserted && (trialTasks.length || /(?:昇格試練|晋升试炼)[·\.]/.test(rawText))) {
                inner += '<div class="st-trial-host">' + renderTrialPanel() + '</div>';
              }

              if (!achievementInserted && st.type === 'income' && achievementTasks.length) {
                inner += '<div class="st-achievement-host">' + renderAchievementPanel() + '</div>';
                achievementInserted = true;
              }

              if (!credentialInserted && !hasLegacyCredentialPanel && st.type === 'income') {
                inner += '<div class="st-cert-host">' + renderCredentialPanel(credentialDecision) + '</div>';
                credentialInserted = true;
              }

              html += '<div class="st-stage t-' + st.type + '"><div class="st-stage-head"><span class="st-stage-no">' + (idx + 1) + '</span><span class="st-stage-name">' + escapeHtml(st.name || '決算段階') + '</span><span class="st-stage-line"></span></div>' + inner + '</div>';
            });
            return html;
          }

          function renderPlain(text) {
            return String(text).replace(/\r/g, '').split('\n')
                .filter(function(l) { return l.trim(); })
                .map(function(l) { return '<div class="st-plain-line">' + escapeHtml(l.trim()) + '</div>'; })
                .join('');
          }

          function hasSettlementHeader(text) {
            return normalizeLegacySettlementHeading(text).includes('輪廻清算プロトコル');
          }

          function isFullSettlement(text) {
            const source = normalizeLegacySettlementHeading(text);
            return ['輪廻清算プロトコル', '世界因果と総合評価', '因果の烙印と干渉の再生', '因果の進展と世界の暗流']
              .every(function(kw) { return source.includes(kw); });
          }

          function isLatestPanelMessage(win, targetMessageId) {
            if (targetMessageId === null || targetMessageId === undefined) return false;
            try {
              const latestId = latestChatMessageId(latestChatMessage(win));
              return latestId != null && Number(latestId) === Number(targetMessageId);
            } catch (e) {}
            return false;
          }

          function settlementTextFingerprint(value) {
            const source = normalizeSettlementComparableText(value);
            let hash = 2166136261;
            for (let i = 0; i < source.length; i++) {
              hash ^= source.charCodeAt(i);
              hash = Math.imul(hash, 16777619);
            }
            return (hash >>> 0).toString(36);
          }

          function resolveSettlementMessageTarget(win, panelText) {
            const panelMessageId = getPanelMessageId(win);
            if (panelMessageId !== null) {
              return {
                targetMessageId: panelMessageId,
                marker: String(panelMessageId),
                isLatestPanel: isLatestPanelMessage(win, panelMessageId)
              };
            }

            // ごく稀な環境では latest の数値ID すら与えられない：latest の原文が現在のパネル決算テキストを完全に含む場合にのみ latest への書き込みを許可する。
            const latest = latestChatMessage(win);
            if (!panelTextBelongsToMessage(panelText, latest)) return null;
            const latestId = latestChatMessageId(latest);
            return {
              targetMessageId: 'latest',
              marker: latestId !== null ? String(latestId) : ('text:' + settlementTextFingerprint(panelText)),
              isLatestPanel: true
            };
          }

          function applySettlementFinalization(c, isLatestPanel) {
            // 過去の決算パネルは表示のみを担当し、現在のデータベースを絶対にクリアしない。
            if (!isLatestPanel) return false;
            const stat = c && (c.stat_data || c);
            if (!stat) return false;

            const hasHeader = hasSettlementHeader(rawText);
            const fullSettlement = isFullSettlement(rawText);
            const trialPassed = isTrialPassed(trialTasks);
            const currentReincarnatorTier = readReincarnatorTier(stat);
            const reincarnatorTierChanged = currentReincarnatorTier !== settlementBaselineTier;
            let changed = false;

            function sameValue(a, b) {
              if (a === b) return true;
              try { return JSON.stringify(a) === JSON.stringify(b); }
              catch (e) { return false; }
            }

            function setValue(target, key, value) {
              if (sameValue(target[key], value)) return;
              target[key] = value;
              changed = true;
            }

            function ensureObject(target, key) {
              const cur = target[key];
              if (!cur || typeof cur !== 'object' || Array.isArray(cur)) {
                target[key] = {};
                changed = true;
              }
              return target[key];
            }

            // 元の onShouldIAdvance に合わせる：清算協議のタイトルが出ただけでも昇格完了マークを補記できる；
            // 完全な清算では元の onClearCache の意味論を踏襲し、データベース内の昇格試練がすべて承認済み完了状態であれば完了と記録する。
            // 階層が既に変化していれば今回の資格は昇格に使用済み；旧決算パネルは再度補記してはならない。
            if (hasHeader && trialPassed && !reincarnatorTierChanged) {
              const currentSys = stat.システム状態 && typeof stat.システム状態 === 'object' ? stat.システム状態 : {};
              if (currentSys.试炼已完成 !== true) {
                const sys = ensureObject(stat, 'システム状態');
                setValue(sys, '試練完了', true);
              }
            }

            if (!fullSettlement) return changed;
            // 任務変数が承認済み完了状態/失敗に落ちるのを待ち、先にクリアしてから昇格資格を検証できなくなるのを避ける。
            if (trialTasks.some(function(task){return !isSettlementTaskTerminal(task.status);})) return changed;

            // 成功/失敗のいずれも今回の試練ライフサイクルの終了を意味する；身分マークは一度だけ消費され、過去のパネルがそれを復活させることはできない。
            const activeTrialSys = stat.システム状態 && typeof stat.システム状態 === 'object' ? stat.システム状態 : null;
            if (activeTrialSys && activeTrialSys.是否试炼任务 === true) {
              const sys = ensureObject(stat, 'システム状態');
              setValue(sys, '試練任務中', false);
              setValue(sys, '試練任務名簿', []);
            }

            const isSingleWorld = !!(stat.設定 && stat.設定.単一世界 === true);
            const tasks = ensureObject(stat, '任務');
            const world = ensureObject(stat, '世界');
            setValue(tasks, '撃破', {Ⅰ:0, Ⅱ:0, Ⅲ:0, Ⅳ:0, Ⅴ:0, Ⅵ:0, Ⅶ:0, Ⅷ:0, Ⅸ:0});

            if (!isSingleWorld) {
              setValue(world, '探索', {});
              // インスタンスキャッシュと同じライフサイクルにし、バックグラウンドイベントがインスタンスを跨いで継承されるのを避ける。
              setValue(world, 'バックステージ', {});

              // 通常インスタンスが現在の世界を離れるとき、関係人物も世界のライフサイクルに従わなければならない。
              // 明確にパーティ関係を結んだ正式な仲間だけが世界を跨いで保持される；高い好感度、まだ場にいること、通常の関係はいずれも保持条件ではない。
              const relations = ensureObject(stat, '関係リスト');
              Object.keys(relations).forEach(function(name) {
                const npc = relations[name];
                if (!npc || npc.仲間 !== true) delete relations[name];
              });

              setValue(world, '勢力', {});
              setValue(world, '安定', 100);
              const radar = ensureObject(world, '異端レーダー');
              setValue(radar, '現在モード', '');
              setValue(radar, '名簿', {});
              setValue(world, '法則', []);
              setValue(world, '通貨', {});
              setValue(world, '因果軌道', {});
              setValue(tasks, 'リスト', {});
              setValue(tasks, 'インスタンス実績', {});

              // 通常インスタンス終了時はプレイヤーが所有/共有管理する資産のみを残す；純NPC、勢力、無主の資産はインスタンスと共に消去する。
              // <user> はプロンプトマクロ；プログラム側では Tavern の現在の Persona 名を正式なプレイヤー身分とし、旧マークは互換のみを担う。
              const assets = ensureObject(stat, '资产');
              const playerOwnerName = (() => {
                try {
                  const host = (window.parent && window.parent !== window) ? window.parent : window;
                  const tavern = host?.SillyTavern;
                  return String(tavern?.getContext?.()?.name1 || tavern?.name1 || '').trim();
                } catch (e) { return ''; }
              })();
              const isPlayerAssetOwner = owner => {
                const value = String(owner || '').trim();
                if (!value) return false;
                return (!!playerOwnerName && value === playerOwnerName)
                  || value === '<user>'
                  || value === '{{user}}'
                  || value === '玩家';
              };
              Object.keys(assets).forEach(function(assetName) {
                const asset = assets[assetName];
                const rawOwners = asset && typeof asset === 'object' ? asset.所属対象 : null;
                // 旧セーブで所属対象が欠落している場合は既存の移行意味論を踏襲する：プレイヤー資産とみなし、誤削除を避ける。
                if (rawOwners == null) return;
                const owners = Array.isArray(rawOwners) ? rawOwners : [rawOwners];
                if (owners.some(isPlayerAssetOwner)) return;
                delete assets[assetName];
                changed = true;
              });

              const rumors = ensureObject(stat, '噂');
              setValue(rumors, '街頭の噂', {});
              setValue(rumors, '情報取引', {});
              setValue(rumors, '布告と檄文', {});

              const sys = ensureObject(stat, 'システム状態');
              // 主神空間は独自の輪廻暦を使用する：第1プレイ日は輪廻暦1年-04月-04日から始まり、
              // 以降は システム状態.プレイ日数 のみで対応付け、いかなるインスタンス世界の年代も継承しない。
              const playDays = Math.max(1, Math.floor(Number(sys.プレイ日数) || 1));
              const samsaraDayIndex = ((4 - 1) * 30 + (4 - 1)) + (playDays - 1);
              const samsaraYear = Math.floor(samsaraDayIndex / 360) + 1;
              const samsaraDayOfYear = samsaraDayIndex % 360;
              const samsaraMonth = Math.floor(samsaraDayOfYear / 30) + 1;
              const samsaraDay = (samsaraDayOfYear % 30) + 1;
              const settlementPad2 = function(value) { return String(value).padStart(2, '0'); };
              const samsaraTime = '轮回历' + samsaraYear + '年-' + settlementPad2(samsaraMonth) + '月-' + settlementPad2(samsaraDay) + '日-清晨';

              setValue(world, '名称', '主神空間');
              setValue(world, '位格', 'Ⅸ');
              setValue(world, '難易度', 'F~SSS');
              setValue(world, '時間', samsaraTime);
              // 暦法はインスタンス世界のライフサイクルに属する；主神空間は前のインスタンスの暦法を保持しない。
              setValue(world, '暦法', {});
              // 輪廻暦の表示値と同期アンカーを取り、補助計算が「主神空間へ戻る」を余分な日跨ぎと誤計算するのを避ける。
              setValue(sys, '前回世界日付', samsaraYear + '-' + samsaraMonth + '-' + samsaraDay);
              setValue(sys, '主神空間滞在中', true);
            } else {
              // 単一世界は同じ世界を使い続ける：探索档案は長期保持されるが、スペースコイン決算には参加しない。
              // 単一世界には副本実績がない；決算時に旧インスタンス/旧バージョンの残留を同時に消去するが、現在の世界と未決算の任務には影響しない。
              setValue(tasks, 'インスタンス実績', {});
              const taskList = ensureObject(tasks, 'リスト');
              settlementTaskKeys.forEach(function(taskKey) {
                if (!Object.hasOwn(taskList, taskKey)) return;
                delete taskList[taskKey];
                changed = true;
              });
            }

            return changed;
          }

          async function writeSettlementToMvu(d, worldName) {
            if (settlementWriteBusy) { settlementWritePending = true; return; }
            settlementWriteBusy = true;
            try {
              const win = window.parent || window;
              if (!win.Mvu || !win._ || !win._.set) return;
              const settlementTarget = resolveSettlementMessageTarget(win, rawText);
              if (!settlementTarget) return;
              const targetMessageId = settlementTarget.targetMessageId;
              const isLatestPanel = settlementTarget.isLatestPanel;
              const c = win.Mvu.getMvuData({ type: 'message', message_id: targetMessageId });
              normalizeLegacyWorldKeys(c && c.stat_data);
              if (!c) return;
              const settlementStat = c.stat_data || c;
              normalizeLegacyCurrencyKey(settlementStat.キャラ);
              const isSingleWorldSettlement = !!(settlementStat.設定 && settlementStat.設定.単一世界 === true);

              // 未完了の昇格試練は昇格資格と最終清理のみを阻止する；完了済み主神任務のスペースコイン/権限証憑/戦利品は通常どおり決算される。
              let changed = false;
              let settlementCoinMarkerPending = null;
              if (!settlementCoinWriteDone && isLatestPanel && isFullSettlement(rawText) && settlementStat.キャラ) {
                const settlementMarker = String(settlementTarget.marker || targetMessageId);
                const recordedMarker = readSettlementCoinMessageMarker(win, targetMessageId);
                const markerState = settlementCoinMarkerState(recordedMarker, settlementMarker);
                const currentCoin = Number(settlementStat.キャラ.スペースコイン);
                let nextCoin = null;
                settlementCoinWriteDone = true;

                if (markerState === 'legacy') {
                  // 旧版では「一回限りのマーク」が書かれていても、過去の任務スナップショット残高が古すぎてスペースコインが未支給になる場合がある。
                  nextCoin = settlementCoinLegacyRepairTarget(currentCoin, legacyRawSpaceCoinSettlement, spaceCoinSettlement);
                  settlementCoinMarkerPending = settlementCoinReceiptMarker(settlementMarker, spaceCoinSettlement);
                } else if (markerState !== 'applied') {
                  nextCoin = settlementCoinWriteTarget(currentCoin, spaceCoinSettlement);
                  settlementCoinMarkerPending = settlementCoinReceiptMarker(settlementMarker, spaceCoinSettlement);
                }

                if (nextCoin !== null) {
                  settlementStat.キャラ.スペースコイン = nextCoin;
                  changed = true;
                }
              }
              function exists(path) {
                try {
                  const cur = win._.get(c, path);
                  return cur && typeof cur === 'object' && Object.keys(cur).length > 0;
                } catch (e) { return false; }
              }

              let baseGrade = '';
              const assess = d.stages.find(function(s) { return s.type === 'assess'; });
              (assess ? assess.items : []).forEach(function(it) {
                if (it.kind !== 'kv') return;
                if (/難易度/.test(it.k) && /评级|等级/.test(it.k) && !baseGrade) baseGrade = gradeFloor(it.v);
              });
              if (!baseGrade) {
                d.stages.forEach(function(s) {
                  s.items.forEach(function(it) {
                    if (it.kind === 'kv' && /難易度/.test(it.k) && /评级|等级/.test(it.k) && !baseGrade) baseGrade = gradeFloor(it.v);
                  });
                });
              }
              if (!baseGrade) baseGrade = 'F';

              const relics = [];
              const golds = [];
              d.stages.forEach(function(s) {
                s.items.forEach(function(it) {
                  if (it.kind === 'relic' && it.name) relics.push(it);
                  if (it.kind === 'relicGold' && it.name) golds.push(it);
                });
              });
              const world = worldName || '';

              if (!isSingleWorldSettlement) {
              const achievementGrants = {};
              achievementTasks.forEach(function(x) {
                if (!isAchievedStatus(x.status)) return;
                const r = parseAchievementReward(x.reward, world);
                if (!r) { console.warn('[決算美化] 成就報酬を識別できない:', x.name, x.reward); return; }
                if (!achievementGrants[r.name]) achievementGrants[r.name] = { grade:r.grade, world:r.world, count:0 };
                achievementGrants[r.name].count++;
              });
              Object.keys(achievementGrants).forEach(function(name) {
                const g = achievementGrants[name], key = 'stat_data.キャラ.道具.' + name;
                const old = win._.get(c, key) || {};
                const currentQty = Number(old.数量) || 0;
                const baselineQty = achievementBaselineData
                  ? (Number(win._.get(achievementBaselineData, key + '.数量')) || 0)
                  : currentQty;
                const requiredQty = baselineQty + g.count;
                const missing = Math.max(0, requiredQty - currentQty);

                if (missing <= 0) return;

                const tags = Array.isArray(old.タグ) ? old.タグ.slice() : [];
                ['主神空間','ブラインドボックス',g.world].filter(Boolean).forEach(function(t) { if (tags.indexOf(t) < 0) tags.push(t); });
                win._.set(c, key + '.品質', g.grade);
                win._.set(c, key + '.タイプ', 'ブラインドボックス');
                win._.set(c, key + '.数量', currentQty + missing);
                win._.set(c, key + '.タグ', tags);
                win._.set(c, key + '.効果', old.効果 && typeof old.効果 === 'object' ? old.効果 : { 开启:'ブラインドボックス抽選，打开后随机抽取「' + (g.world || '主神空間') + '」对应品质的奖励。' });
                win._.set(c, key + '.説明', old.説明 || '副本成就奖励。');
                win._.set(c, key + '.状態', [0,1,2].includes(Number(old.状態)) ? Number(old.状態) : 0);
                changed = true;
              });
              }

              if (credentialGrant) {
                const key = 'stat_data.キャラ.権限証憑.' + credentialGrant.grade;
                const currentQty = Math.max(0, Number(win._.get(c, key)) || 0);
                const baselineQty = settlementBaselineData
                  ? Math.max(0, Number(win._.get(settlementBaselineData, key)) || 0)
                  : currentQty;
                const requiredQty = baselineQty + 1;
                if (currentQty < requiredQty) {
                  win._.set(c, key, requiredQty);
                  changed = true;
                }
              }

              function parseEffectLines(txt) {
                const eff = {};
                if (!txt) return eff;
                txt.split('\n').map(function(x) { return x.trim(); }).filter(Boolean).forEach(function(ln) {
                  const nm = ln.match(/^\d+[.、]\s*(.+)$/);
                  const em = ln.match(/^[【\[]([^【】\[\]：:]{1,12})[】\]]\s*[：:]\s*(.+)$/);
                  const bm = ln.match(/^[【\[]([^【】\[\]：:]{1,12})[】\]]\s*(.+)$/);
                  if (nm && nm[1].indexOf('：') >= 0) {
                    const pm = nm[1].split('：');
                    eff[pm[0].trim()] = pm.slice(1).join('：').trim();
                  } else if (em) eff[em[1].trim()] = em[2].trim();
                  else if (nm && bm) eff[bm[1].trim()] = bm[2].trim();
                  else if (nm) eff['事迹' + (Object.keys(eff).length + 1)] = nm[1];
                  else if (bm) eff[bm[1].trim()] = bm[2].trim();
                  else {
                    const last = Object.keys(eff).pop();
                    if (last) eff[last] += ' ' + ln;
                    else eff['持有时'] = ln;
                  }
                });
                return eff;
              }

              golds.forEach(function(g) {
                if (!g.name || exists('stat_data.キャラ.装備.' + g.name)) return;
                const key = 'stat_data.キャラ.装備.' + g.name;
                win._.set(c, key + '.品質', baseGrade);
                win._.set(c, key + '.タイプ', 8);
                win._.set(c, key + '.タグ', ['主神空間', g.origin || world].filter(Boolean));
                win._.set(c, key + '.原始属性', {});
                win._.set(c, key + '.効果', parseEffectLines(g.effect));
                win._.set(c, key + '.説明', g.desc || (world ? ('世界遺物, 出典: ' + world) : '世界遺物'));
                win._.set(c, key + '.消費', '');
                win._.set(c, key + '.状態', 0);
                changed = true;
              });

              relics.forEach(function(r) {
                if (!r.name || exists('stat_data.キャラ.道具.' + r.name)) return;
                const key = 'stat_data.キャラ.道具.' + r.name;
                win._.set(c, key + '.品質', baseGrade);
                win._.set(c, key + '.タイプ', r.type || '記念品');
                win._.set(c, key + '.数量', 1);
                win._.set(c, key + '.タグ', ['主神空間', world].filter(Boolean));
                win._.set(c, key + '.効果', parseEffectLines(r.effect));
                win._.set(c, key + '.説明', r.desc || '');
                win._.set(c, key + '.状態', 0);
                changed = true;
              });

              if (isLatestPanel && isFullSettlement(rawText)) {
                const engine = win.Samsara && win.Samsara.worldEngine;
                if (engine) engine.cancel();
              }
              if (applySettlementFinalization(c, isLatestPanel)) changed = true;

              if (!changed) {
                if (settlementCoinMarkerPending !== null) {
                  writeSettlementCoinMessageMarker(win, targetMessageId, settlementCoinMarkerPending);
                }
                return;
              }
              await win.Mvu.replaceMvuData(c, { type: 'message', message_id: targetMessageId });

              if (isLatestPanel) {
                try { await win.Mvu.replaceMvuData(c, { type: 'chat' }); } catch (e3) {}
              }
              if (settlementCoinMarkerPending !== null) {
                writeSettlementCoinMessageMarker(win, targetMessageId, settlementCoinMarkerPending);
              }
            } catch (e) { console.warn('決算任務のデータベース書き込みに失敗:', e); }
            finally {
              settlementWriteBusy = false;
              if (settlementWritePending) { settlementWritePending = false; setTimeout(refreshTrialPanel, 0); }
            }
          }

          const btn = wrapper.querySelector('.st-btn');
          const rawDiv = wrapper.querySelector('.st-raw');
          const labelSpan = wrapper.querySelector('.st-label');
          const panelDiv = wrapper.querySelector('.st-panel');
          if (!btn || !rawDiv || !labelSpan || !panelDiv) return;

          const rawText = resolveSettlementRawText(rawDiv.textContent, window.parent || window);
          const d = parseSettlement(rawText);
          injectProgrammaticIncomeStage(d, spaceCoinSettlement);

          let worldName = '';
          const sm = (d.serial || '').match(/^Ω-(.+)-结算$/);
          if (sm) worldName = sm[1];
          labelSpan.textContent = worldName ? ('輪廻清算 · ' + worldName) : '輪廻清算プロトコル';

          const hasStruct = d.title || d.serial || d.player ||
              d.stages.some(function(s) {
                return s.name || s.items.some(function(i) { return i.kind !== 'para'; });
              });
          panelDiv.innerHTML = hasStruct ? renderSettlement(d) : renderPlain(rawText);

          // 初回描画は表示のみ；このフロアの MVU 状態が安定してからプログラム決算と消去を実行する。

          function refreshTrialPanel() {
            refreshSettlementBaseline();
            refreshAchievementTasks();
            injectProgrammaticIncomeStage(d, spaceCoinSettlement);
            panelDiv.innerHTML = hasStruct ? renderSettlement(d) : renderPlain(rawText);
            const latest = readTrialTasks();
            if (latest.length) {
              // AIが一つ書き漏らしただけでも「全試練完了」の判定集合を狭めない。
              const byKey = new Map(latest.map(function(task){return [task.key, task];}));
              const merged = trialTasks.map(function(task){const next=byKey.get(task.key);byKey.delete(task.key);return next || task;}).concat(Array.from(byKey.values()));
              const score = trialScore(merged);
              if (score >= bestTrialScore) {
                trialTasks = merged;
                bestTrialScore = score;
              }
            }
            // 「変数の再処理」が VARIABLE_UPDATE_ENDED のみをトリガーする場合も、冪等な決算書き込みを再実行する。
            if (hasStruct) writeSettlementToMvu(d, worldName);
            panelDiv.querySelectorAll('.st-trial-host').forEach(function(host) {
              host.innerHTML = renderTrialPanel();
            });
          }

          try {
            const ctx = getMvuContext();
            const win = ctx && ctx.win;
            const onFn = win && typeof win.eventOn === 'function' ? win.eventOn : (typeof eventOn === 'function' ? eventOn : null);
            const mvu = win && win.Mvu ? win.Mvu : (typeof Mvu !== 'undefined' ? Mvu : null);
            if (onFn && mvu && mvu.events && mvu.events.VARIABLE_UPDATE_ENDED) {
              onFn(mvu.events.VARIABLE_UPDATE_ENDED, function() { setTimeout(refreshTrialPanel, 0); });
            }
          } catch (e) {}
          setTimeout(refreshTrialPanel, 250);
          setTimeout(refreshTrialPanel, 600);

          setTimeout(function() {
            panelDiv.querySelectorAll('.st-stab-fill').forEach(function(el) {
              el.style.width = (el.getAttribute('data-w') || 0) + '%';
            });
          }, 60);

          panelDiv.querySelectorAll('.st-num-val').forEach(function(el) {
            const nm = el.textContent.match(/-?[\d,]+/);
            if (!nm) return;
            const target = parseCnNum(nm[0]);
            if (target == null) return;
            const dur = 900;
            const t0 = performance.now();
            (function tick(t) {
              const p = Math.min(1, (t - t0) / dur);
              const eased = 1 - Math.pow(1 - p, 3);
              el.textContent = fmtNum(target * eased);
              if (p < 1) requestAnimationFrame(tick);
            })(t0);
          });

          btn.addEventListener('click', function() {
            btn.classList.toggle('active');
            panelDiv.classList.toggle('show');
          });

        })();
      </script>
    </div>
    <!-- 替换模板结束 -->

</body>
</html>
